name: Flutter CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: yogya

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: yogya

      - name: Run tests with coverage
        run: flutter test --coverage
        working-directory: yogya

      - name: Upload coverage to Codecov
        if: github.event_name == 'push'
        uses: codecov/codecov-action@v4
        with:
          file: yogya/coverage/lcov.info
          flags: flutter
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    needs: analyze-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: flutter pub get
        working-directory: yogya

      - name: Create .env file
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
        working-directory: yogya

      - name: Build APK (release)
        run: flutter build apk --release --obfuscate --split-debug-info=build/debug-info
        working-directory: yogya

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: yogya-release-apk
          path: yogya/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug symbols (for Sentry)
        uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: yogya/build/debug-info/
          retention-days: 90
